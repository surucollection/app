plugins {
    id 'com.android.application'
}

android {
    namespace 'np.suru.collection.app'
    compileSdk 35

    defaultConfig {
        applicationId 'np.suru.collection.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }
}
